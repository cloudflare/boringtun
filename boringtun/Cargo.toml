[package]
name = "boringtun"
description = "an implementation of the WireGuard® protocol designed for portability and speed"
version = "0.7.1"
authors = [
    "Noah Kennedy <nkennedy@cloudflare.com>",
    "Andy Grover <agrover@cloudflare.com>",
    "Jeff Hiner <jhiner@cloudflare.com>",
]
license = "BSD-3-Clause"
readme = "../README.md"
repository = "https://github.com/cloudflare/boringtun"
documentation = "https://docs.rs/boringtun/0.7.1/boringtun/"
edition = "2018"

[features]
default = ["std"]
alloc = []
std = ["dep:nix", "dep:parking_lot", "dep:winsafe", "alloc", "once_cell/std"]
device = ["std", "socket2", "thiserror"]
jni-bindings = ["std", "ffi-bindings", "jni"]
ffi-bindings = ["std", "tracing-subscriber"]
defmt = ["dep:defmt", "fugit/defmt"]

[dependencies]
base64 = { version = "0.23.0", default-features = false }
hex = { version = "0.4", default-features = false }
untrusted = "0.9.0"
libc = { version = "0.2", default-features = false }
parking_lot = { version = "0.12.4", optional = true }
lock_api = "0.4.13"
spin = { version = "0.12.2" }
once_cell = { version = "1.19.0", default-features = false, features = [
  "critical-section",
] }
portable-atomic = { version = "1.13.1", features = ["fallback"] }
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }
ip_network = { version = "0.4.1", default-features = false }
ip_network_table = { version = "0.2.0", default-features = false }
ring = { version = "0.17.14", default-features = false }
x25519-dalek = { version = "3.0.0", features = [
  "getrandom",
  "reusable_secrets",
  "static_secrets",
] }
rand = { version = "0.10.1", default-features = false, features = ["sys_rng"] }
chacha20poly1305 = { version = "0.11.0", default-features = false }
aead = "0.6.0-rc.2"
blake2 = { version = "0.11.0-rc.6", default-features = false }
hmac = "0.13.0"
jni = { version = "0.19.0", optional = true }
socket2 = { version = "0.4.7", features = ["all"], optional = true }
thiserror = { version = "2", optional = true }
fugit = { version = "0.5", default-features = false }
defmt = { version = "1.1.1", optional = true, features = ["ip_in_core"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", optional = true, default-features = false, features = [
    "time",
    "user",
] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.28", optional = true, default-features = false, features = [
  "kernel",
] }

[dev-dependencies]
base64 = { version = "0.23.0", default-features = false, features = ["alloc"] }
etherparse = "0.13"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
tracing-subscriber = "0.3"
criterion = { version = "0.8.2", features = ["html_reports"] }

[lib]
crate-type = ["rlib"]

[[bench]]
name = "crypto_benches"
harness = false
